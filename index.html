        <div id="air">
          <div id="air-row">
            <div id="air-label">騎樓商店街 空氣</div>
            <div class="bar" id="air-bar"><div class="fill" id="air-fill" data-level="dirty" style="transform: scaleX(0.02)"></div></div>
          </div>
          <div id="points">清新點數 0</div>
        </div>
        <canvas id="minimap"></canvas>
        <div id="place"><span id="place-city"></span><span id="place-area"></span><span id="place-street"></span></div>
        <div id="alert"></div>
        <div id="enemy-count"></div>
      </div>
      <div id="boss">
        <div id="boss-name"></div>
        <div class="bar"><div class="fill" id="boss-fill"></div></div>
      </div>
      <div id="status"></div>
      <div id="hud-bottom" class="hud-col">
        <div id="items"></div>
        <div id="controls">
          <div id="controls-hint" class="chip"><span class="key">H</span>操作說明</div>
          <div id="controls-panel">
            <div class="ctl-head"><span>操作說明</span></div>
            <div class="ctl"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>移動</div>
            <div class="ctl"><span class="key">滑鼠</span><span class="key">方向鍵</span>轉鏡頭</div>
            <div class="ctl"><span class="key">J</span><span class="key">左鍵</span>輕攻擊</div>
            <div class="ctl"><span class="key">K</span><span class="key">右鍵</span>重攻擊（按住蓄力）</div>
            <div class="ctl"><span class="key">空白鍵</span>閃避</div>
            <div class="ctl"><span class="key">L</span>格擋（抓準時機＝彈反）</div>
            <div class="ctl"><span class="key">E</span>勸阻／熄菸／抓取</div>
            <div class="ctl"><span class="key">F</span>撿起／丟出／騎車</div>
            <div class="ctl"><span class="key">Q</span>必殺（點按旋風／按住深呼吸）</div>
            <div class="ctl"><span class="key">1</span><span class="key">2</span><span class="key">3</span>用道具</div>
            <div class="ctl"><span class="key">Tab</span>技能／商店／任務</div>
            <div class="ctl">騎車時<span class="key">J</span><span class="key">K</span>飛踢　<span class="key">L</span>煞車</div>
            <div class="ctl">騎車時<span class="key">E</span>抓下騎士／下車</div>
            <div class="ctl">騎車時<span class="key">空白鍵</span>跳車</div>
            <div class="ctl"><span class="key">M</span>靜音</div>
            <div class="ctl"><span class="key">Esc</span>放開滑鼠</div>
            <div class="ctl"><span class="key">`</span>開發者面板</div>
            <div class="ctl"><span class="key">H</span>收起說明</div>
          </div>
        </div>
      </div>
      <div id="labels"></div>
      <div id="sfx"></div>
      <div id="prompt"></div>
      <div id="popups"></div>
      <div id="fx-hurt"></div>
      <div id="fx-time"></div>
      <div id="talk">
        <div id="talk-bars">
          <div class="talk-row">
            <span>耐心</span>
            <div class="bar"><div class="fill" id="talk-patience" style="transform: scaleX(1)"></div></div>
          </div>
        </div>
        <div id="talk-bottom">
          <div id="talk-feedback"></div>
          <div id="talk-insight"></div>
          <div id="talk-options">
            <div class="talk-option"><b>J</b><span></span></div>
            <div class="talk-option"><b>K</b><span></span></div>
            <div class="talk-option"><b>L</b><span></span></div>
          </div>
          <div id="talk-escape"><b>E</b>先動手（放棄獎勵，對方會愣住）</div>
        </div>
      </div>
      <div id="message">
        <div id="message-title"></div>
        <div id="message-hint"></div>
      </div>
      <div id="menu"></div>
      <div id="intro">
        <div id="intro-caption" class="empty"></div>
        <div id="intro-skip"><span class="key">Esc</span>跳過</div>
      </div>
      <div id="intro-flash"></div>
      <div id="start">
        <div id="start-title"><span>打</span><span>爆</span><span>菸</span><span>狗</span></div>
        <div id="start-sub">高雄市</div>
        <div id="start-hint">按任意鍵或點一下開始</div>
      </div>
    </div>
  </body>
</html>
